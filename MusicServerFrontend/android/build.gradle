// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Cover app, Capacitor, and regenerated Cordova instrumentation classpaths.
    // Kotlin 1.8 merges the old jdk7/jdk8 classes into the main standard library.
    ['com.android.application', 'com.android.library'].each { androidPlugin ->
        pluginManager.withPlugin(androidPlugin) {
            dependencies {
                implementation platform("org.jetbrains.kotlin:kotlin-bom:${rootProject.ext.kotlinStdlibVersion}")
                androidTestImplementation platform("org.jetbrains.kotlin:kotlin-bom:${rootProject.ext.kotlinStdlibVersion}")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
