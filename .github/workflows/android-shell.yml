name: Android shell bootstrap

on:
  workflow_dispatch:
    inputs:
      free_usage_verified:
        description: Free quota is available and paid Actions usage is blocked on this account
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: android-shell-bootstrap
  cancel-in-progress: true

jobs:
  shell:
    if: ${{ inputs.free_usage_verified }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      CAPACITOR_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Check bootstrap contracts
        run: node --test tests/scripts/android-bootstrap.test.cjs tests/scripts/android-sdk-workflow.test.cjs
      - name: Install selected Android SDK components
        shell: bash
        run: |
          sdk_manager="${ANDROID_HOME:?ANDROID_HOME must point to the Android SDK}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -executable -print -quit)"
          fi
          if [ -z "$sdk_manager" ] || [ ! -x "$sdk_manager" ]; then
            echo "::error::Android SDK Command-line Tools not found"
            exit 1
          fi
          "$sdk_manager" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          java -version
          node --version
          npm --version
          cat "$ANDROID_HOME/platforms/android-36/source.properties"
          cat "$ANDROID_HOME/build-tools/35.0.0/source.properties"
      - name: Restore app and sync assets into the checked-in Android project
        working-directory: MusicServerFrontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run android:sync
      - name: Compile both variants and invoke the native unit test task
        working-directory: MusicServerFrontend/android
        shell: bash
        run: |
          bash ./gradlew --version
          bash ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Verify diagnostic isolation in the built release APK
        shell: bash
        run: |
          apk_analyzer="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name apkanalyzer -executable -print -quit)"
          if [ -z "$apk_analyzer" ] || [ ! -x "$apk_analyzer" ]; then
            echo "::error::Android APK Analyzer not found"
            exit 1
          fi
          mkdir -p .local/android-release-check
          release_apk=MusicServerFrontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$apk_analyzer" manifest print "$release_apk" > .local/android-release-check/manifest.xml
          "$apk_analyzer" dex packages --defined-only "$release_apk" > .local/android-release-check/packages.txt
          node scripts/check-android-release.cjs .local/android-release-check/manifest.xml .local/android-release-check/packages.txt
      - name: Package debug APK and build report
        shell: bash
        run: |
          mkdir -p .local/android-artifact
          cp MusicServerFrontend/android/app/build/outputs/apk/debug/app-debug.apk .local/android-artifact/music-server-shell-debug.apk
          cp MusicServerFrontend/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk .local/android-artifact/music-server-shell-debug-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose .local/android-artifact/music-server-shell-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose .local/android-artifact/music-server-shell-debug-tests.apk
          node - <<'NODE'
          const fs = require('node:fs');
          const report = {
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            node: process.version,
            selectedPins: JSON.parse(fs.readFileSync('scripts/android-toolchain.json', 'utf8')),
            source: 'checked-in Android project',
            apkBuildVerified: true,
            releaseIsolationVerified: true,
            // The arithmetic template test was removed; the unit task has no app test cases yet.
            nativeUnitTestsVerified: false,
            instrumentationCompiled: true,
            connectedDeviceTestsVerified: false,
            physicalDeviceVerified: false,
            backgroundPlaybackVerified: false,
          };
          fs.writeFileSync('.local/android-artifact/build-report.json', JSON.stringify(report, null, 2) + '\n');
          NODE
          cd .local/android-artifact
          sha256sum music-server-shell-debug.apk music-server-shell-debug-tests.apk build-report.json > SHA256SUMS.txt
          test "$(du -sb . | cut -f1)" -lt 104857600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-shell-${{ github.run_id }}
          path: .local/android-artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
